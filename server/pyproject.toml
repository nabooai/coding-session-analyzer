[project]
name = "coding-session-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "cryptography>=42",
    "mcp>=1.28.1",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0.51",
    "strawberry-graphql>=0.240",
    "tantivy>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# Dropped at adoption (2026-09-05) with the hit count on the tree; re-enable a rule once its hits are gone.
ignore = [
    "E401",  # 38: `import os, sys` on one line
    "E702",  # 106: `a; b` statements on one line (csa.py 38, tracer.py 11, llm.py 8, ...)
    "E731",  # 23: lambda assigned to a name
    "E741",  # 9: variable named `l`
    "B011",  # 11: `assert False` inside module self-check blocks; moving them to tests is its own change
    "B904",  # 2: `raise` inside `except` without `from`; adding it changes traceback chaining, decide per site
    "B905",  # 10: `zip()` without `strict=`; adding it can raise on unequal lengths
    "UP017", # 15: `timezone.utc` -> `datetime.UTC`
    "UP031", # 13: `%` formatting -> f-string
]

[tool.ruff.lint.per-file-ignores]
"analyzer/gql.py" = ["UP006", "UP045"]  # 5 + 30: strawberry schema annotations (`List[X]`, `Optional[X]`)
