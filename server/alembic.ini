# Three environments, one per SQLite file. The runtime never reads this file: the server migrates
# on the connection it already holds (analyzer/migrations.py). It is the developer's entry point:
#
#   uv run alembic -c alembic.ini -n corpus revision --autogenerate -m "what changed"
#   uv run alembic -c alembic.ini -n corpus check
#
# sqlalchemy.url is a throwaway path built by `alembic upgrade head`; autogenerating against a
# stale data/analyzer.db would diff the models against last month's schema.
#
# prepend_sys_path puts server/ on the path before a revision module is imported. The revisions call
# analyzer.migrations.catch_up, and `heads`, `history` and `show` import them WITHOUT running env.py,
# so without this those three commands die with ModuleNotFoundError from whatever directory you run
# them in. %(here)s is this file's own directory, so it holds when the shell is somewhere else.

[corpus]
prepend_sys_path = %(here)s
path_separator = os
script_location = %(here)s/migrations/corpus
sqlalchemy.url = sqlite:///%(here)s/build/corpus.db

[telemetry]
prepend_sys_path = %(here)s
path_separator = os
script_location = %(here)s/migrations/telemetry
sqlalchemy.url = sqlite:///%(here)s/build/telemetry.db

[control]
prepend_sys_path = %(here)s
path_separator = os
script_location = %(here)s/migrations/control
sqlalchemy.url = sqlite:///%(here)s/build/control.db
