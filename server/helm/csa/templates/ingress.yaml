{{- if eq .Values.frontDoor "nginx" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "csa.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"      # /mcp streams
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"      # a transcript is one POST; nginx's default is 1m
    {{- with .Values.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.nginx.className }}
  tls:
    - hosts: [{{ include "csa.host" . }}]
      secretName: {{ .Values.tls.secretName }}
  rules:
    - host: {{ include "csa.host" . }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}, port: {name: mcp}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}, port: {name: api}}
{{- end }}
