{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingressFrom }}
{{- fail "networkPolicy.ingressFrom is required when networkPolicy.enabled: the front door pods that may connect" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "csa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - {port: api, protocol: TCP}
        - {port: mcp, protocol: TCP}
  egress: {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
