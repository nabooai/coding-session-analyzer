name: Bug report
description: Report a reproducible CSA problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or route, expected result, and actual result. Remove secrets and private session text.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, installation method, browser, and Claude Code version where relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
