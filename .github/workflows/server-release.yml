name: Server release

# Cut a PINNED, versioned server image release. Push a tag `server-vX.Y.Z` (e.g. server-v1.0.0) and this
#   1. builds both multi-arch images (amd64 + arm64),
#   2. pushes ghcr.io/nabooai/csa-server:X.Y.Z (the with-claude-code target, never public) and
#      ghcr.io/nabooai/csa-server-slim:X.Y.Z (the default build, no Claude Code), each moving its :latest,
#   3. creates a GitHub Release for the tag,
#   4. attaches the offline bundle csa-onprem-X.Y.Z.tar.gz (the `bundle` job): per-arch tarballs of the SLIM image, the
#      Caddy image the compose pins, the compose kit, the Helm chart csa-X.Y.Z.tgz and the docs, SHA256SUMS, an SPDX SBOM,
#      and Sigstore bundles (keyless, this workflow's OIDC identity) that verify offline. docs/public-release/bundle.md.
#      Release assets are as public as the repository, so nothing attached to a release may carry Claude Code.
# Deploy a version = point CSA_SERVER_IMAGE at the tag and `docker compose pull && up -d` (see the notes).
on:
  push:
    tags: ['server-v*']

permissions:
  contents: write          # create the GitHub Release
  packages: write          # push to GHCR

env:
  IMAGE: ghcr.io/nabooai/csa-server
  SLIM: ghcr.io/nabooai/csa-server-slim

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/server-v}" >> "$GITHUB_OUTPUT"   # server-v1.0.0 -> 1.0.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Smoke both amd64 images before anything is pushed: non-root, the pinned CLI or none, venv imports, VERSION,
      # baked UI and client.
      - name: Build with-claude-code amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: with-claude-code
          platforms: linux/amd64
          load: true
          build-args: CSA_VERSION=${{ steps.v.outputs.version }}
          tags: csa-server:smoke

      - name: Smoke test with-claude-code
        run: bash server/image-smoke.sh csa-server:smoke ${{ steps.v.outputs.version }} with-claude-code

      - name: Build slim amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: CSA_VERSION=${{ steps.v.outputs.version }}
          tags: csa-server-slim:smoke

      - name: Smoke test slim
        run: bash server/image-smoke.sh csa-server-slim:smoke ${{ steps.v.outputs.version }} slim

      - name: Build + push csa-server (with Claude Code)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: with-claude-code
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CSA_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Build + push csa-server-slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CSA_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.SLIM }}:${{ steps.v.outputs.version }}
            ${{ env.SLIM }}:latest

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          Docker image: \`${SLIM}:${V}\` (multi-arch amd64+arm64, no Claude Code; Bedrock, Vertex and subscription tokens need the Dockerfile's \`with-claude-code\` target).

          **Deploy this version**: set \`CSA_SERVER_IMAGE=${SLIM}:${V}\` in \`server/.env\`, then
          \`docker compose -f docker-compose.trial.yml pull && docker compose -f docker-compose.trial.yml up -d\`.
          Roll back by pointing \`CSA_SERVER_IMAGE\` at an earlier \`server-v*\` tag and repeating.

          **Offline bundle:** \`csa-onprem-${V}.tar.gz\` below, verified as in \`bundle.md\` inside it.
          EOF
          if gh release view "server-v${V}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "server-v${V}" --repo "$GITHUB_REPOSITORY" --title "CSA server v${V}" --notes-file release-notes.md
          else
            gh release create "server-v${V}" --repo "$GITHUB_REPOSITORY" --title "CSA server v${V}" --generate-notes --notes-file release-notes.md
          fi

  # The offline bundle: everything a box with no registry access needs, signed so it can be checked there.
  bundle:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload the assets to the release the job above created
      packages: read       # pull the image the job above pushed
      id-token: write      # cosign keyless: this workflow's OIDC token is the signing identity
    env:
      V: ${{ needs.release.outputs.version }}
      B: /tmp/csa-onprem-${{ needs.release.outputs.version }}
      IDENTITY_RE: ^https://github\.com/nabooai/coding-session-analyzer/\.github/workflows/server-release\.yml@refs/tags/server-v
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p "$B"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The slim image the job above smoke-tested and pushed, pulled back one platform at a time (`docker save`
      # exports one platform). The tag inside is what `docker load` prints and what CSA_SERVER_IMAGE names.
      - name: Server image tarballs, both architectures, from the pushed image
        run: |
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$SLIM:$V"
            docker tag "$SLIM:$V" "csa-server-slim:$V-$arch"
            docker save -o "$B/csa-server-slim-$V-$arch.tar" "csa-server-slim:$V-$arch"
            docker rmi "csa-server-slim:$V-$arch"
          done
          # Keep the registry reference until both platform manifests have been exported. Removing it
          # inside the loop can delete the manifest-list metadata needed by the second pull.
          docker rmi "$SLIM:$V" 2>/dev/null || true

      # The compose pins Caddy by digest. A loaded tarball carries a tag but never a digest (the digest is
      # a registry manifest, which `docker load` cannot reconstruct), so the tarball is saved under a tag and
      # docker-compose.bundle.yml points the proxy service at that tag.
      - name: Caddy tarballs, both architectures, from the digest the compose pins
        run: |
          ref="$(grep -o 'caddy@sha256:[0-9a-f]\{64\}' server/docker-compose.trial.yml | head -1)"
          [ -n "$ref" ] || { echo "no caddy@sha256 pin in server/docker-compose.trial.yml" >&2; exit 1; }
          ver="$(docker run --rm --platform linux/amd64 "$ref" caddy version | cut -d' ' -f1 | sed 's/^v//')"
          case "$ver" in [0-9]*.[0-9]*) ;; *) echo "unexpected caddy version '$ver'" >&2; exit 1 ;; esac
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$ref"
            docker tag "$ref" "caddy:$ver-$arch"
            docker save -o "$B/caddy-$ver-$arch.tar" "caddy:$ver-$arch"
          done
          # Keep all local tags and the digest reference until both exports complete; removing one
          # platform tag can delete shared manifest metadata needed by the second pull.
          docker rmi "caddy:$ver-amd64" "caddy:$ver-arm64" 2>/dev/null || true
          docker rmi "$ref" 2>/dev/null || true
          cat > "$B/docker-compose.bundle.yml" <<EOF
          # From the offline bundle csa-onprem-${V}. The proxy image is caddy-${ver}-<arch>.tar, loaded by tag:
          # docker-compose.trial.yml pins caddy by digest, and a loaded tarball has a tag but no digest, so this
          # override names the tag. The tarball was saved from ${ref}, the digest the compose pins.
          #   export COMPOSE_FILE=docker-compose.trial.yml:docker-compose.bundle.yml COMPOSE_PROFILES=proxy
          services:
            proxy:
              image: caddy:${ver}
          EOF
          echo "CADDY_REF=$ref" >> "$GITHUB_ENV"
          echo "CADDY_VER=$ver" >> "$GITHUB_ENV"

      - name: Compose kit and docs
        run: |
          cp server/docker-compose.trial.yml server/Caddyfile server/.env.example "$B/"
          cp docs/public-release/install-server.md docs/public-release/install-client.md \
             docs/public-release/bundle.md docs/public-release/egress.md docs/public-release/data-at-rest.md "$B/"

      - name: Helm chart, versioned from the tag
        run: helm package server/helm/csa --version "$V" --app-version "$V" --destination "$B"

      - uses: anchore/sbom-action/download-syft@v0
        id: syft
        with:
          syft-version: v1.51.1

      # One SBOM per image. The slim one goes in the bundle and lists no CLI. syft sees the CLI as a bare file, not a
      # package, so the other image's SBOM gets the entry from the Dockerfile's pin; it sits beside the bundle, and
      # that image's tarball is written outside $B so that it never ends up in a release asset.
      - name: SBOM of each amd64 image (SPDX 2.3 JSON)
        run: |
          "${{ steps.syft.outputs.cmd }}" "docker-archive:$B/csa-server-slim-$V-amd64.tar" \
            -o "spdx-json=$B/csa-server-slim-$V-amd64.spdx.json"
          if grep -q 'claude-code' "$B/csa-server-slim-$V-amd64.spdx.json"; then
            echo "the slim image's SBOM lists Claude Code" >&2; exit 1
          fi
          docker pull --platform linux/amd64 "$IMAGE:$V"
          docker save -o "/tmp/csa-server-$V-amd64.tar" "$IMAGE:$V"
          "${{ steps.syft.outputs.cmd }}" "docker-archive:/tmp/csa-server-$V-amd64.tar" \
            -o "spdx-json=/tmp/csa-server-$V-amd64.spdx.json"
          rm "/tmp/csa-server-$V-amd64.tar"
          python3 .github/scripts/sbom_add_claude.py "/tmp/csa-server-$V-amd64.spdx.json" server/Dockerfile x64
          grep -q '"name": "@anthropic-ai/claude-code-linux-x64"' "/tmp/csa-server-$V-amd64.spdx.json"

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      # sign-blob with no key: cosign takes the job's OIDC token, Fulcio issues a certificate naming this
      # workflow and tag, Rekor records it, and the .sigstore.json bundle carries all three. The Sigstore
      # trusted root is copied in so a box with no route to sigstore.dev can verify.
      - name: MANIFEST, SHA256SUMS, signatures
        run: |
          cd "$B"
          cli="$(grep -o 'com.csa.claude_code=[0-9.]*' "$GITHUB_WORKSPACE/server/Dockerfile" | cut -d= -f2)"
          {
            echo "csa-onprem ${V}"
            echo "server_version ${V}"
            echo "server_image csa-server-slim:${V} (also ${SLIM}:${V})"
            echo "source_commit ${GITHUB_SHA}"
            echo "client_version ${V} (built into the image from source_commit)"
            echo "helm_chart csa-${V}.tgz (appVersion ${V}, image ${SLIM}:${V})"
            echo "caddy caddy:${CADDY_VER} saved from ${CADDY_REF}"
            echo "claude_code none in this bundle (the Dockerfile's with-claude-code target adds ${cli})"
            echo "built $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "signing_identity_regexp ${IDENTITY_RE}"
            echo "signing_oidc_issuer ${OIDC_ISSUER}"
          } > MANIFEST.txt
          cosign initialize
          cp "$HOME/.sigstore/root/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json" sigstore-trusted-root.json
          for f in "csa-server-slim-$V-amd64.tar" "csa-server-slim-$V-arm64.tar"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          sums="$(find . -type f | sed 's|^\./||' | sort | xargs sha256sum)"
          printf '%s\n' "$sums" > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          # what the customer runs, run here first: a wrong identity would otherwise surface on their box
          for f in "csa-server-slim-$V-amd64.tar" "csa-server-slim-$V-arm64.tar" SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" --trusted-root sigstore-trusted-root.json \
              --certificate-identity-regexp "$IDENTITY_RE" --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
          sha256sum -c SHA256SUMS

      - name: Pack, sign the tarball, attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp
          tar -czf "csa-onprem-$V.tar.gz" "csa-onprem-$V"
          cosign sign-blob --yes --bundle "csa-onprem-$V.tar.gz.sigstore.json" "csa-onprem-$V.tar.gz"
          cosign verify-blob --bundle "csa-onprem-$V.tar.gz.sigstore.json" \
            --trusted-root "$B/sigstore-trusted-root.json" \
            --certificate-identity-regexp "$IDENTITY_RE" --certificate-oidc-issuer "$OIDC_ISSUER" "csa-onprem-$V.tar.gz"
          ls -la "csa-onprem-$V.tar.gz"
          gh release upload "server-v$V" --repo "$GITHUB_REPOSITORY" --clobber \
            "csa-onprem-$V.tar.gz" "csa-onprem-$V.tar.gz.sigstore.json" \
            "$B/csa-server-slim-$V-amd64.spdx.json" "/tmp/csa-server-$V-amd64.spdx.json" "$B/csa-$V.tgz" \
            "$B/csa-server-slim-$V-amd64.tar.sigstore.json" "$B/csa-server-slim-$V-arm64.tar.sigstore.json" \
            "$B/SHA256SUMS" "$B/SHA256SUMS.sigstore.json" "$B/MANIFEST.txt"
