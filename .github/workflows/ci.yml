name: CI

# The merge gate: every PR into master runs the unit suites, lint, UI build, Helm chart,
# and hermetic E2E harnesses. server/e2e/README.md lists what each harness proves.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m pytest tests/ -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.mod
      - run: go vet ./...
      - run: go test ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ui/package-lock.json
      - run: uv sync --frozen
        working-directory: server
      - run: npm ci && npm run build
        working-directory: server/ui
      - run: server/e2e/run.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The floor the plugin promises; the server job runs the same file on the current Python.
      - run: uv tool run --python 3.9 --with pytest pytest --noconftest -q server/tests/test_plugin_client.py
      - run: npx -y @anthropic-ai/claude-code plugin validate .

  e2e-onprem:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [slim, with-claude-code]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.mod
      - run: uv sync --frozen
        working-directory: server
      - run: server/e2e/run.sh onprem ${{ matrix.target }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.4
      - run: bash server/helm/csa/ci/smoke.sh
